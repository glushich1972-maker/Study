        }

        }

        }

        }

        }

        }

        }

        }

            margin: 1rem 0;

        }

</head>

function loadSemesters() {

    semesterSelect.innerHTML =
        '<option value="">Выберите семестр...</option>';

    STUDY_DATA.forEach(semester => {

        const option =
            document.createElement("option");

        option.value = semester.id;
        option.textContent = semester.name;

        semesterSelect.appendChild(option);

    });
}


function loadSubjects() {

    const semester =
        STUDY_DATA.find(
            item => item.id === semesterSelect.value
        );

    subjectSelect.innerHTML =
        '<option value="">Выберите дисциплину...</option>';

    topicSelect.innerHTML =
        '<option value="">Сначала выберите дисциплину...</option>';

    subjectSelect.disabled = true;
    topicSelect.disabled = true;

    resetViewer();

    if (!semester) return;

    semester.subjects.forEach(subject => {

        const option =
            document.createElement("option");

        option.value = subject.id;
        option.textContent = subject.name;

        subjectSelect.appendChild(option);

    });

    subjectSelect.disabled = false;
}


function loadTopics() {

    const semester =
        STUDY_DATA.find(
            item => item.id === semesterSelect.value
        );

    if (!semester) return;

    const subject =
        semester.subjects.find(
            item => item.id === subjectSelect.value
        );

    topicSelect.innerHTML =
        '<option value="">Выберите тему...</option>';

    topicSelect.disabled = true;

    resetViewer();

    if (!subject) return;

    subject.topics.forEach(topic => {

        const option =
            document.createElement("option");

        option.value = topic.id;
        option.textContent = topic.name;

        topicSelect.appendChild(option);

    });

    topicSelect.disabled = false;
}


function getCurrentTopic() {

    const semester =
        STUDY_DATA.find(
            item => item.id === semesterSelect.value
        );

    if (!semester) return null;

    const subject =
        semester.subjects.find(
            item => item.id === subjectSelect.value
        );

    if (!subject) return null;

    return subject.topics.find(
        item => item.id === topicSelect.value
    ) || null;
}


function showTopic() {

    const topic = getCurrentTopic();

    resetViewer();

    if (!topic) return;

    topicInfo.classList.remove("hidden");

    topicDescription.textContent =
        topic.description || "";

    materialButtons.classList.remove("hidden");

    questionsContainer.innerHTML = "";

    if (topic.questions && topic.questions.length > 0) {

        questionsSection.classList.remove("hidden");

        topic.questions.forEach((item, index) => {

            const details =
                document.createElement("details");

            details.className =
                "group bg-gray-50 p-3 rounded-xl border border-gray-200";


            const summary =
                document.createElement("summary");

            summary.className =
                "font-medium cursor-pointer list-none flex justify-between items-center";


            const question =
                document.createElement("span");

            question.textContent =
                `${index + 1}. ${item.q}`;


            const arrow =
                document.createElement("span");

            arrow.className =
                "text-xs transition group-open:rotate-180";

            arrow.textContent = "▼";


            summary.appendChild(question);
            summary.appendChild(arrow);


            const answer =
                document.createElement("div");

            answer.className =
                "mt-2 text-sm text-gray-600 border-t pt-2";

            answer.textContent =
                item.a;


            details.appendChild(summary);
            details.appendChild(answer);

            questionsContainer.appendChild(details);

        });

    } else {

        questionsSection.classList.add("hidden");

    }

    if (topic.materials && topic.materials.md) {
        loadMarkdown(topic.materials.md);
    }

}


async function loadMarkdown(url) {

    hideAllViewers();

    viewerPlaceholder.classList.add("hidden");

    markdownViewer.classList.remove("hidden");

    markdownContent.innerHTML =
        '<div class="text-center text-gray-400 py-10">Загрузка лекции...</div>';

    try {

        const response =
            await fetch(url);

        if (!response.ok) {
            throw new Error("Файл не найден");
        }

        const text =
            await response.text();

        markdownContent.innerHTML =
            marked.parse(text);


        const images =
            markdownContent.querySelectorAll("img");

        images.forEach(img => {

            const src =
                img.getAttribute("src");

            if (
                src &&
                !src.startsWith("http") &&
                !src.startsWith("/")
            ) {

                const base =
                    url.substring(
                        0,
                        url.lastIndexOf("/") + 1
                    );

                img.src =
                    base + src;

            }

        });

    } catch (error) {

        markdownContent.innerHTML = `
            <div class="text-center text-red-500 py-10">
                Не удалось загрузить лекцию.
                <br>
                <span class="text-xs">
                    ${error.message}
                </span>
            </div>
        `;

    }

}


function loadPDF(url) {

    hideAllViewers();

    viewerPlaceholder.classList.add("hidden");

    pdfViewer.classList.remove("hidden");

    pdfViewer.src = url;

}


function loadDOCX(url) {

    hideAllViewers();

    viewerPlaceholder.classList.add("hidden");

    pdfViewer.classList.remove("hidden");

    const absoluteURL =
        new URL(url, window.location.href).href;

    pdfViewer.src =
        "https://view.officeapps.live.com/op/embed.aspx?src="
        + encodeURIComponent(absoluteURL);

}


function hideAllViewers() {

    pdfViewer.classList.add("hidden");

    markdownViewer.classList.add("hidden");

    pdfViewer.src = "";

}


function resetViewer() {

    hideAllViewers();

    materialButtons.classList.add("hidden");

    questionsSection.classList.add("hidden");

    topicInfo.classList.add("hidden");

    markdownContent.innerHTML = "";

    viewerPlaceholder.classList.remove("hidden");

}

    document.documentElement
        .setAttribute("data-theme", theme);

    themeBtn.textContent =
        theme === "light"
            ? "🌙"
            : "☀️";

    localStorage.setItem(
        "study-theme",
        theme
    );

}


themeBtn.addEventListener(

            document.documentElement
                .getAttribute("data-theme");

);

const calendarBtn =
    document.getElementById("calendarBtn");

const closeCalendarBtn =
    document.getElementById("closeCalendarBtn");

const calendarModal =
    document.getElementById("calendarModal");

const addEventBtn =
    document.getElementById("addEventBtn");

const calendarDate =
    document.getElementById("calendarDate");

const calendarEvent =
    document.getElementById("calendarEvent");

const eventsList =
    document.getElementById("eventsList");


calendarBtn.addEventListener(
    "click",
    () => {

        calendarModal.classList
            .remove("hidden");

        calendarModal.classList
            .add("flex");

        renderEvents();

    }
);


closeCalendarBtn.addEventListener(
    "click",
    closeCalendar
);


calendarModal.addEventListener(
    "click",
    event => {

        if (event.target === calendarModal) {
            closeCalendar();
        }

    }
);


function closeCalendar() {

    calendarModal.classList
        .add("hidden");

    calendarModal.classList
        .remove("flex");

}


function getEvents() {

    try {

        return JSON.parse(
            localStorage.getItem(
                "study-events"
            )
        ) || [];

    } catch {

        return [];

    }

}


function saveEvents(events) {

    localStorage.setItem(
        "study-events",
        JSON.stringify(events)
    );

}


addEventBtn.addEventListener(
    "click",
    () => {

        const date =
            calendarDate.value;

        const text =
            calendarEvent.value.trim();

        if (!date || !text) {

            alert(
                "Укажите дату и событие."
            );

            return;

        }


        const events =
            getEvents();


        events.push({
            date: date,
            text: text
        });


        events.sort(
            (a, b) =>
                a.date.localeCompare(b.date)
        );


        saveEvents(events);

        calendarEvent.value = "";

        renderEvents();

    }
);


function renderEvents() {

    const events =
        getEvents();

    eventsList.innerHTML = "";


    if (events.length === 0) {

        eventsList.innerHTML =
            '<div class="text-gray-400 text-center py-2">Пока нет напоминаний.</div>';

        return;

    }


    events.forEach(
        (event, index) => {

            const item =
                document.createElement("div");

            item.className =
                "flex justify-between items-center bg-gray-50 p-3 rounded-xl";


            const info =
                document.createElement("div");

            const date =
                document.createElement("div");

            date.className =
                "font-medium";

            date.textContent =
                event.date;


            const text =
                document.createElement("div");

            text.className =
                "text-gray-500 text-xs mt-1";

            text.textContent =
                event.text;


            info.appendChild(date);
            info.appendChild(text);


            const deleteBtn =
                document.createElement("button");

            deleteBtn.className =
                "text-red-400 text-xs ml-2";

            deleteBtn.textContent =
                "✕";


            deleteBtn.addEventListener(
                "click",
                () => {

                    events.splice(
                        index,
                        1
                    );

                    saveEvents(events);

                    renderEvents();

                }
            );


            item.appendChild(info);
            item.appendChild(deleteBtn);

            eventsList.appendChild(item);

        }
    );

}
